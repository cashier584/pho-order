<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#991B1B"/>
      <stop offset="30%" stop-color="#DC2626"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="85%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
    <linearGradient id="silverCan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#FDFBF7"/>
  <ellipse cx="200" cy="255" rx="75" ry="16" fill="#E2D9CC" opacity="0.6"/>

  <!-- Can Top Rim -->
  <ellipse cx="200" cy="85" rx="46" ry="14" fill="url(#silverCan)" stroke="#64748B" stroke-width="1.5"/>
  <ellipse cx="200" cy="85" rx="38" ry="10" fill="#CBD5E1"/>
  <!-- Pull tab ring -->
  <ellipse cx="200" cy="84" rx="14" ry="5" fill="none" stroke="#64748B" stroke-width="2"/>
  <circle cx="200" cy="84" r="2.5" fill="#475569"/>

  <!-- Can Main Body -->
  <path d="M 152 90 L 152 225 Q 200 242 248 225 L 248 90 Q 200 102 152 90 Z" fill="url(#canGrad)"/>
  
  <!-- Can Bottom Rim -->
  <ellipse cx="200" cy="225" rx="48" ry="14" fill="url(#silverCan)" stroke="#64748B" stroke-width="1.2"/>

  <!-- Decorative Wave / Brand Stripe on Can -->
  <path d="M 152 140 Q 200 170 248 135 L 248 160 Q 200 195 152 165 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 152 155 Q 200 185 248 150 L 248 165 Q 200 200 152 170 Z" fill="#FBBF24" opacity="0.85"/>

  <!-- Glossy Reflection Highlight -->
  <rect x="168" y="94" width="12" height="130" fill="#FFFFFF" opacity="0.25" rx="4"/>
  <rect x="183" y="96" width="3" height="126" fill="#FFFFFF" opacity="0.4"/>

  <!-- Ice cubes sitting next to can -->
  <rect x="235" y="195" width="35" height="35" rx="8" fill="#E0F2FE" opacity="0.85" stroke="#BAE6FD" stroke-width="2" transform="rotate(15 252 212)"/>
  <rect x="125" y="205" width="32" height="32" rx="7" fill="#E0F2FE" opacity="0.85" stroke="#BAE6FD" stroke-width="2" transform="rotate(-12 141 221)"/>

  <!-- Chill vapor / droplets -->
  <circle cx="165" cy="120" r="2.5" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="163" cy="155" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="235" cy="145" r="2" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="230" cy="180" r="2.5" fill="#FFFFFF" opacity="0.8"/>
</svg>
