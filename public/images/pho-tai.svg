<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="brothGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CA8A04"/>
      <stop offset="60%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>
    <linearGradient id="bowlGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="beefRare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48"/>
      <stop offset="60%" stop-color="#BE123C"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(0,0,0,0.18)"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0)"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Warm Canvas -->
  <rect width="400" height="300" rx="16" fill="#FDFBF7"/>

  <!-- Subtle Mat / Table shadow -->
  <ellipse cx="200" cy="245" rx="150" ry="22" fill="#E2D9CC" opacity="0.6"/>
  <ellipse cx="200" cy="240" rx="130" ry="16" fill="#D4C5B2" opacity="0.4"/>

  <!-- Bowl Outer Rim & Body -->
  <ellipse cx="200" cy="180" rx="135" ry="70" fill="url(#bowlGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 68 175 Q 75 240 200 242 Q 325 240 332 175 Z" fill="url(#bowlGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Decorative Ceramic Pattern on Bowl -->
  <path d="M 85 190 Q 200 230 315 190" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-dasharray="6,4" opacity="0.75"/>
  <ellipse cx="200" cy="238" rx="65" ry="8" fill="#94A3B8" opacity="0.3"/>

  <!-- Bowl Inner Soup Surface -->
  <ellipse cx="200" cy="170" rx="124" ry="58" fill="url(#brothGrad)"/>
  <ellipse cx="200" cy="168" rx="116" ry="52" fill="#92400E" opacity="0.25"/>

  <!-- Pho Noodles (Bánh phở mềm) -->
  <g stroke="#FFFBEB" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 120 160 Q 150 185 190 170 Q 230 155 260 180"/>
    <path d="M 100 175 Q 140 195 200 180 Q 240 170 280 185"/>
    <path d="M 140 150 Q 170 170 210 165 Q 250 160 270 170"/>
    <path d="M 115 185 Q 160 200 220 190 Q 270 185 295 175"/>
  </g>

  <!-- Rare Beef Slices (Thịt bò tái hồng hào mềm mướt) -->
  <path d="M 130 155 C 135 140, 175 145, 185 160 C 190 175, 150 180, 130 155 Z" fill="url(#beefRare)"/>
  <path d="M 140 150 Q 160 160 175 155" stroke="#FECDD3" stroke-width="1.5" fill="none" opacity="0.7"/>
  
  <path d="M 175 145 C 185 130, 225 135, 230 152 C 235 168, 195 170, 175 145 Z" fill="url(#beefRare)"/>
  <path d="M 185 142 Q 205 150 220 148" stroke="#FECDD3" stroke-width="1.5" fill="none" opacity="0.7"/>

  <path d="M 155 170 C 165 158, 205 160, 210 175 C 215 188, 175 192, 155 170 Z" fill="url(#beefRare)"/>
  <path d="M 165 168 Q 185 175 200 172" stroke="#FECDD3" stroke-width="1.5" fill="none" opacity="0.7"/>

  <!-- Fresh Spring Onions & Herbs (Hành hoa, ngò gai) -->
  <!-- Scallion rings -->
  <circle cx="120" cy="165" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="120" cy="165" r="2.5" fill="#DCFCE7"/>
  <circle cx="215" cy="160" r="6" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="215" cy="160" r="3" fill="#DCFCE7"/>
  <circle cx="245" cy="170" r="5.5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="245" cy="170" r="2.5" fill="#DCFCE7"/>
  <circle cx="160" cy="188" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="190" cy="180" r="4.5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>

  <!-- Chopped Scallions & Cilantro Sprigs -->
  <path d="M 220 180 Q 235 165 250 175 Q 235 190 220 180" fill="#16A34A"/>
  <path d="M 235 165 Q 248 155 258 165 Q 245 175 235 165" fill="#15803D"/>
  <path d="M 105 155 Q 120 148 128 158" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 180 190 Q 200 198 215 192" stroke="#4ADE80" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Red Chili Slices -->
  <ellipse cx="260" cy="155" rx="7" ry="4" fill="#DC2626" transform="rotate(-20 260 155)"/>
  <ellipse cx="260" cy="155" rx="3.5" ry="1.8" fill="#FEF08A" transform="rotate(-20 260 155)"/>
  <ellipse cx="140" cy="180" rx="6" ry="3.5" fill="#DC2626" transform="rotate(35 140 180)"/>
  <ellipse cx="140" cy="180" rx="3" ry="1.5" fill="#FEF08A" transform="rotate(35 140 180)"/>

  <!-- Steaming Vapor (Hơi khói nóng nghi ngút) -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#softGlow)">
    <path d="M 160 120 Q 150 90 165 65 Q 175 45 160 25"/>
    <path d="M 200 115 Q 215 85 195 60 Q 185 40 200 20"/>
    <path d="M 240 120 Q 250 90 235 65 Q 225 45 240 25"/>
  </g>

  <!-- Chopsticks resting on side -->
  <g stroke="#92400E" stroke-linecap="round">
    <line x1="280" y1="120" x2="350" y2="85" stroke-width="4.5"/>
    <line x1="285" y1="125" x2="355" y2="90" stroke-width="4"/>
  </g>
</svg>
