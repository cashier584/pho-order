<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="brothGradChin" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="65%" stop-color="#9A3412"/>
      <stop offset="100%" stop-color="#6B21A8"/>
    </radialGradient>
    <linearGradient id="bowlGradChin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="beefCooked" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9A3412"/>
      <stop offset="50%" stop-color="#7C2D12"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
    <filter id="softGlowChin" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="300" rx="16" fill="#FDFBF7"/>
  <ellipse cx="200" cy="245" rx="150" ry="22" fill="#E2D9CC" opacity="0.6"/>
  
  <!-- Bowl Outer Rim & Body -->
  <ellipse cx="200" cy="180" rx="135" ry="70" fill="url(#bowlGradChin)" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 68 175 Q 75 240 200 242 Q 325 240 332 175 Z" fill="url(#bowlGradChin)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Dark Blue Traditional Rim -->
  <path d="M 85 190 Q 200 230 315 190" fill="none" stroke="#1D4ED8" stroke-width="2.5" stroke-dasharray="8,4" opacity="0.7"/>

  <!-- Broth Surface -->
  <ellipse cx="200" cy="170" rx="124" ry="58" fill="url(#brothGradChin)"/>

  <!-- Noodles -->
  <g stroke="#FEF3C7" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.95">
    <path d="M 115 165 Q 160 190 220 175 Q 260 160 285 175"/>
    <path d="M 105 180 Q 150 200 210 185 Q 260 180 290 190"/>
    <path d="M 130 150 Q 180 165 240 160"/>
  </g>

  <!-- Cooked Beef Brisket slices (Bò chín thái mỏng thơm ngậy) -->
  <g>
    <rect x="135" y="148" width="55" height="26" rx="6" fill="url(#beefCooked)" transform="rotate(-10 160 160)"/>
    <line x1="140" y1="155" x2="185" y2="150" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
    <line x1="142" y1="163" x2="182" y2="158" stroke="#FDE68A" stroke-width="1.2" opacity="0.6"/>

    <rect x="180" y="145" width="55" height="26" rx="6" fill="url(#beefCooked)" transform="rotate(8 205 158)"/>
    <line x1="185" y1="153" x2="230" y2="160" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
    <line x1="187" y1="161" x2="228" y2="167" stroke="#FDE68A" stroke-width="1.2" opacity="0.6"/>

    <rect x="150" y="168" width="58" height="24" rx="6" fill="url(#beefCooked)" transform="rotate(2 180 180)"/>
    <line x1="155" y1="176" x2="202" y2="178" stroke="#FDE68A" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Lime slice (Chanh tươi) -->
  <path d="M 260 150 A 18 18 0 0 1 285 175 Z" fill="#84CC16" stroke="#4D7C0F" stroke-width="2"/>
  <path d="M 264 154 A 14 14 0 0 1 281 171 Z" fill="#BEF264"/>
  <circle cx="266" cy="168" r="1.5" fill="#4D7C0F"/>

  <!-- Scallions & Cilantro -->
  <circle cx="125" cy="170" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="230" cy="175" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="210" cy="188" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <path d="M 120 155 Q 135 145 150 152" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 225 180 Q 240 188 255 182" stroke="#16A34A" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Steaming Vapor -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45" filter="url(#softGlowChin)">
    <path d="M 170 120 Q 155 85 175 60 Q 185 40 170 20"/>
    <path d="M 215 115 Q 230 85 210 58 Q 200 38 215 18"/>
  </g>
</svg>
