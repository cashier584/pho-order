<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="quayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="40%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="80%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#FDFBF7"/>
  <ellipse cx="200" cy="245" rx="150" ry="22" fill="#E2D9CC" opacity="0.6"/>

  <!-- Oval Plate -->
  <ellipse cx="200" cy="195" rx="145" ry="55" fill="url(#plateGrad)" stroke="#CBD5E1" stroke-width="2"/>
  <ellipse cx="200" cy="192" rx="130" ry="46" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Crispy Dough Sticks (Quẩy giòn rụm) -->
  <!-- Stick 1 (bottom left) -->
  <g transform="rotate(-15 150 180)">
    <rect x="90" y="170" width="130" height="22" rx="11" fill="url(#quayGrad)"/>
    <rect x="90" y="185" width="130" height="20" rx="10" fill="url(#quayGrad)"/>
    <!-- Crisp texture cuts -->
    <line x1="110" y1="172" x2="115" y2="202" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="140" y1="172" x2="145" y2="202" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="175" y1="172" x2="180" y2="202" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="90" y1="184" x2="220" y2="184" stroke="#92400E" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Stick 2 (crossed over) -->
  <g transform="rotate(12 210 175)">
    <rect x="140" y="160" width="135" height="23" rx="11" fill="url(#quayGrad)"/>
    <rect x="140" y="176" width="135" height="21" rx="10" fill="url(#quayGrad)"/>
    <!-- Crisp cuts -->
    <line x1="165" y1="162" x2="170" y2="194" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="200" y1="162" x2="205" y2="194" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="235" y1="162" x2="240" y2="194" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="140" y1="175" x2="275" y2="175" stroke="#92400E" stroke-width="2.5" opacity="0.5"/>
  </g>

  <!-- Stick 3 (on top) -->
  <g transform="rotate(-3 200 160)">
    <rect x="130" y="145" width="140" height="24" rx="12" fill="url(#quayGrad)"/>
    <rect x="130" y="162" width="140" height="22" rx="11" fill="url(#quayGrad)"/>
    <!-- Highlights and ridges -->
    <line x1="155" y1="147" x2="160" y2="180" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="190" y1="147" x2="195" y2="180" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="230" y1="147" x2="235" y2="180" stroke="#78350F" stroke-width="1.8" opacity="0.6"/>
    <line x1="130" y1="160" x2="270" y2="160" stroke="#92400E" stroke-width="2.5" opacity="0.5"/>
    <line x1="140" y1="150" x2="260" y2="150" stroke="#FEF08A" stroke-width="2" opacity="0.75"/>
  </g>

  <!-- Steam -->
  <g stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M 180 120 Q 170 95 185 75"/>
    <path d="M 220 115 Q 235 90 220 70"/>
  </g>
</svg>
