<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <radialGradient id="brothGradGa" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="60%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </radialGradient>
    <linearGradient id="bowlGradGa" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="chickenMeat" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3"/>
      <stop offset="70%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>
  </defs>

  <rect width="400" height="300" rx="16" fill="#FDFBF7"/>
  <ellipse cx="200" cy="245" rx="150" ry="22" fill="#E2D9CC" opacity="0.6"/>

  <!-- Bowl -->
  <ellipse cx="200" cy="180" rx="135" ry="70" fill="url(#bowlGradGa)" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 68 175 Q 75 240 200 242 Q 325 240 332 175 Z" fill="url(#bowlGradGa)" stroke="#CBD5E1" stroke-width="2"/>
  <path d="M 85 190 Q 200 230 315 190" fill="none" stroke="#16A34A" stroke-width="2" stroke-dasharray="6,4" opacity="0.7"/>

  <!-- Golden Chicken Broth -->
  <ellipse cx="200" cy="170" rx="124" ry="58" fill="url(#brothGradGa)"/>

  <!-- Noodles -->
  <g stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M 115 160 Q 155 185 210 172 Q 255 160 285 175"/>
    <path d="M 125 175 Q 165 195 225 185 Q 265 178 290 188"/>
  </g>

  <!-- Shredded Chicken Breast & Golden Skin (Gà ta xé phay da vàng giòn) -->
  <g>
    <!-- Chicken piece 1 -->
    <path d="M 130 152 C 140 140, 175 142, 185 158 C 175 172, 140 168, 130 152 Z" fill="url(#chickenMeat)"/>
    <path d="M 132 148 Q 155 142 178 152" stroke="#CA8A04" stroke-width="3" fill="none"/>

    <!-- Chicken piece 2 -->
    <path d="M 175 145 C 185 132, 220 136, 230 152 C 220 166, 185 164, 175 145 Z" fill="url(#chickenMeat)"/>
    <path d="M 178 140 Q 202 135 225 146" stroke="#CA8A04" stroke-width="3.5" fill="none"/>

    <!-- Chicken piece 3 -->
    <path d="M 150 165 C 160 155, 195 156, 202 172 C 190 184, 160 180, 150 165 Z" fill="url(#chickenMeat)"/>
    <path d="M 152 160 Q 175 155 198 165" stroke="#EAB308" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Lime Leaves Sliced (Lá chanh thái chỉ thơm lừng) -->
  <g stroke="#15803D" stroke-width="1.8" stroke-linecap="round">
    <line x1="150" y1="145" x2="168" y2="152"/>
    <line x1="165" y1="140" x2="182" y2="148"/>
    <line x1="180" y1="148" x2="200" y2="156"/>
    <line x1="172" y1="160" x2="190" y2="168"/>
    <line x1="195" y1="158" x2="215" y2="164"/>
  </g>

  <!-- Lime wedge -->
  <path d="M 255 150 A 18 18 0 0 1 280 175 Z" fill="#84CC16" stroke="#4D7C0F" stroke-width="2"/>
  <path d="M 259 154 A 14 14 0 0 1 276 171 Z" fill="#BEF264"/>

  <!-- Spring onions & chili -->
  <circle cx="125" cy="165" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <circle cx="215" cy="175" r="5" fill="#22C55E" stroke="#15803D" stroke-width="2"/>
  <ellipse cx="238" cy="165" rx="7" ry="3.5" fill="#DC2626" transform="rotate(-15 238 165)"/>

  <!-- Steaming Vapor -->
  <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.45">
    <path d="M 165 115 Q 150 82 170 58 Q 180 38 165 18"/>
    <path d="M 210 110 Q 225 80 205 52 Q 195 35 210 15"/>
  </g>
</svg>
